<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome to Barkley Bites</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    video {
      height: 100vh;
      width: auto;
      max-width: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video autoplay playsinline id="vid">
    <source src="onboarding-video.mp4" type="video/mp4" />
  </video>

  <script>
    const vid = document.getElementById('vid');
    let timeout;

    function showControls() {
      vid.controls = true;
      clearTimeout(timeout);
      timeout = setTimeout(() => {
        vid.controls = false;
      }, 2000);
    }

    vid.addEventListener('mousemove', showControls);
    vid.addEventListener('touchstart', showControls);
  </script>
</body>
</html>
